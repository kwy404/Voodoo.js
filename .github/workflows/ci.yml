name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      # Coverage gate. The thresholds live in `vitest.config.ts` and apply only
      # to the core: parser, reactivity, runtime, DOM and HTTP.
      - name: Check core coverage
        run: npm run coverage

      - name: Build the bundles
        run: npm run build

      - name: Check bundle size
        run: node scripts/size.mjs

  consistency:
    name: Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Four gates, each one added after the drift it catches had already
      # shipped at least once.

      # The site announced 0.1.0 for five releases, and `V.version` reported
      # 0.4.6 while the package was 0.6.2.
      - name: Check the version is stamped everywhere
        run: node scripts/stamp-version.mjs --check

      # A relative href that resolves to nothing serves a 404 on a site with no
      # build step to catch it.
      - name: Check every internal link resolves
        run: npm run check:links

      # English is canonical. Both of these passed silently for a while: the
      # documentation check because `lang="pt-BR"` was wrong in both directions,
      # and the source check because its first word list used unaccented
      # spellings that English shares.
      - name: Check the documentation is in English
        run: npm run check:lang:docs

      - name: Check the source comments are in English
        run: npm run check:lang:src

      # The live example frames measured themselves and grew 8px on every
      # click. Reported three times before it was understood, and the first
      # regression test written for it passed against the broken code.
      - name: Check the example frames do not grow
        run: npm run check:frame

      # voodoojs-cli published with no README at all, so its npm page was blank,
      # and its `files` listed a `templates` directory that does not exist.
      # Nothing in a normal build looks at what would actually be published.
      - name: Check what each package would publish
        run: npm run check:packaging

      # The interpreter against real JavaScript, 2324 expressions with the host
      # engine as the oracle. Fails when a bug or a gap appears that was not
      # there before.
      - name: Check the interpreter still agrees with JavaScript
        run: npm run build && npm run check:conformance
