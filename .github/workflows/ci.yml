name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Baixa o repositorio
        uses: actions/checkout@v4

      - name: Prepara o Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala as dependencias
        run: npm ci

      - name: Confere os tipos
        run: npm run typecheck

      - name: Roda os testes
        run: npm test

      - name: Gera os bundles
        run: npm run build

      - name: Confere o tamanho dos bundles
        run: node scripts/size.mjs
