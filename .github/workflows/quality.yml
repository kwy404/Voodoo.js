name: Quality

# Kept separate from CI on purpose. `ci.yml` answers "is it broken?", so it has
# to be fast, run across the Node version matrix and block a merge. This one
# answers "is it any good?": it runs once, produces the report with the security,
# accessibility, packaging, API compatibility and documentation findings, and
# publishes the file as an artifact for a person to read.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality report
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The API compatibility check compares against the committed snapshot;
          # the full history helps when it reports a break and someone has to
          # work out which commit caused it.
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the bundles
        # The report inspects dist/: size, sourcemaps, CSP compatibility, the
        # public surface and the tarball contents. With no build, half the
        # checks would have nothing but SKIP to report.
        run: npm run build

      - name: Install the browser the browser tests need
        # Without this step the Playwright specs do not fail because of the
        # code: they all fail with "Executable doesn't exist", because the
        # runner has the package installed and no browser downloaded. The report
        # then shows every spec failing and a 2.0 on a check that passes
        # completely on the machine of whoever wrote it. `npm ci` installs the
        # package, not Chromium.
        run: npx playwright install --with-deps chromium

      - name: Run the quality report
        run: npm run quality -- --ci --report

      - name: Publish QUALITY_REPORT.md
        # Runs even when the previous step failed: a red build is exactly when
        # the report has the most to say.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: QUALITY_REPORT.md
          if-no-files-found: error
          retention-days: 30
