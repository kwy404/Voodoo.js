<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 88" width="340" height="88" role="img" aria-labelledby="logoDarkT logoDarkD">
  <title id="logoDarkT">Voodoo.js, logo horizontal para fundo escuro</title>
  <desc id="logoDarkD">Símbolo do alfinete mágico em V ao lado da palavra Voodoo em creme pergaminho seguida do sufixo ponto js em roxo claro.</desc>

  <defs>
    <style>
      .vd-txt { fill: #2A2440; }
      .vd-txt-forte { fill: #14111F; }
      .vd-haste { stroke: #2A2440; }
      .vd-rim { stroke: transparent; }
      .vd-decor { opacity: 0.13; }
      @media (prefers-color-scheme: dark) {
        .vd-txt { fill: #FBF7F2; }
        .vd-txt-forte { fill: #FBF7F2; }
        .vd-haste { stroke: #9B7BFF; }
        .vd-rim { stroke: #FBF7F2; }
        .vd-decor { opacity: 0.26; }
      }
    </style>
    <linearGradient id="logoDarkGrad" gradientUnits="userSpaceOnUse" x1="20" y1="32" x2="50" y2="62">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#6D3BF5"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 16) scale(0.875)">
    <path d="M16 22 L32 50 L46 22" fill="none" stroke="url(#logoDarkGrad)" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="16" cy="22" r="7.5" fill="#FF3D8B"/>
    <path d="M42 20 L50 24 L51 12 Z" fill="#FFB35C"/>
    <path d="M52 2 Q52 10 60 10 Q52 10 52 18 Q52 10 44 10 Q52 10 52 2 Z" fill="#FFB35C"/>
  </g>

  <text x="82" y="58" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="44" font-weight="700" letter-spacing="-1.2" fill="#FBF7F2">Voodoo<tspan fill="#9B7BFF">.js</tspan></text>
</svg>
