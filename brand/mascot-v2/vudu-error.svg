  <title id="verrT">Vudu sad</title>
  <desc id="verrD">Vudu, a small purple felt voodoo doll with cream stitching, big glossy eyes, three sewing pins with pennant flags in its head and a glowing amber charm with curly braces on its chest, sad with a tear and a frown, its middle pin fallen to the ground. For error and 404 pages.</desc>
