<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="runesT runesD">
  <title id="runesT">Padrão de runas do Voodoo.js</title>
  <desc id="runesD">Textura sutil e repetível com faíscas, anéis, triângulos, luas e pontos de costura em roxo bem claro, feita para o fundo de seções de destaque.</desc>

