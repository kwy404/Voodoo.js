<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 509" width="760" height="509" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="14" y="22" font-size="12.5" font-weight="700" fill="#8b8b9e">Which route each edit took, and what it cost — 10.000 rows, logarithmic</text><text x="14" y="37" font-size="10.5" fill="#8b8b9e">Purple: the mutation itself said what changed. Grey: the lists had to be compared. Rows visited by the reconciler, counted.</text><text x="14" y="65" font-size="10.5" font-weight="700" fill="#8b8b9e">one mutation, list of 10.000</text><line x1="14" y1="71" x2="746" y2="71" stroke="#e4e1ee" stroke-width="1"/><text x="250" y="91" font-size="10.5" text-anchor="end" fill="#8b8b9e">push 1</text><rect x="258" y="83" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="91" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="111" font-size="10.5" text-anchor="end" fill="#8b8b9e">unshift 1</text><rect x="258" y="103" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="111" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="131" font-size="10.5" text-anchor="end" fill="#8b8b9e">pop</text><rect x="258" y="123" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="131" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="151" font-size="10.5" text-anchor="end" fill="#8b8b9e">shift</text><rect x="258" y="143" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="151" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="171" font-size="10.5" text-anchor="end" fill="#8b8b9e">splice out 1 in the middle</text><rect x="258" y="163" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="171" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="191" font-size="10.5" text-anchor="end" fill="#8b8b9e">splice in 1 in the middle</text><rect x="258" y="183" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="191" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="250" y="211" font-size="10.5" text-anchor="end" fill="#8b8b9e">write one element</text><rect x="258" y="203" width="42.0" height="10" rx="2" fill="#6D3BF5"/><text x="308.0" y="211" font-size="10" fill="#6D3BF5" font-weight="700">3</text><text x="250" y="231" font-size="10.5" text-anchor="end" fill="#8b8b9e">length = 9999</text><rect x="258" y="223" width="21.0" height="10" rx="2" fill="#6D3BF5"/><text x="287.0" y="231" font-size="10" fill="#6D3BF5" font-weight="700">1</text><text x="14" y="257" font-size="10.5" font-weight="700" fill="#8b8b9e">several mutations in one tick, list of 10.000</text><line x1="14" y1="263" x2="746" y2="263" stroke="#e4e1ee" stroke-width="1"/><text x="250" y="283" font-size="10.5" text-anchor="end" fill="#8b8b9e">two pushes</text><rect x="258" y="275" width="33.3" height="10" rx="2" fill="#6D3BF5"/><text x="299.3" y="283" font-size="10" fill="#6D3BF5" font-weight="700">2</text><text x="250" y="303" font-size="10.5" text-anchor="end" fill="#8b8b9e">two unshifts</text><rect x="258" y="295" width="33.3" height="10" rx="2" fill="#6D3BF5"/><text x="299.3" y="303" font-size="10" fill="#6D3BF5" font-weight="700">2</text><text x="250" y="323" font-size="10.5" text-anchor="end" fill="#8b8b9e">push then shift</text><rect x="258" y="315" width="300.0" height="10" rx="2" fill="#6D3BF5"/><text x="566.0" y="323" font-size="10" fill="#6D3BF5" font-weight="700">20,001</text><text x="250" y="343" font-size="10.5" text-anchor="end" fill="#8b8b9e">splices at both ends</text><rect x="258" y="335" width="299.9" height="10" rx="2" fill="#6D3BF5"/><text x="565.9" y="343" font-size="10" fill="#6D3BF5" font-weight="700">19,942</text><text x="250" y="363" font-size="10.5" text-anchor="end" fill="#8b8b9e">four splices in the middle</text><rect x="258" y="355" width="75.3" height="10" rx="2" fill="#6D3BF5"/><text x="341.3" y="363" font-size="10" fill="#6D3BF5" font-weight="700">11</text><text x="250" y="383" font-size="10.5" text-anchor="end" fill="#8b8b9e">40 pushes (past the log limit)</text><rect x="258" y="375" width="279.1" height="10" rx="2" fill="#b0abc2"/><text x="545.1" y="383" font-size="10" fill="#8b8b9e" font-weight="400">10,040</text><text x="14" y="409" font-size="10.5" font-weight="700" fill="#8b8b9e">no mutation to read — a new array arrives</text><line x1="14" y1="415" x2="746" y2="415" stroke="#e4e1ee" stroke-width="1"/><text x="250" y="435" font-size="10.5" text-anchor="end" fill="#8b8b9e">same rows, new array</text><rect x="258" y="427" width="279.0" height="10" rx="2" fill="#b0abc2"/><text x="545.0" y="435" font-size="10" fill="#8b8b9e" font-weight="400">10,000</text><text x="250" y="455" font-size="10.5" text-anchor="end" fill="#8b8b9e">remove 1 in the middle</text><rect x="258" y="447" width="279.0" height="10" rx="2" fill="#b0abc2"/><text x="545.0" y="455" font-size="10" fill="#8b8b9e" font-weight="400">10,000</text><text x="250" y="475" font-size="10.5" text-anchor="end" fill="#8b8b9e">reverse in place</text><rect x="258" y="467" width="300.0" height="10" rx="2" fill="#b0abc2"/><text x="566.0" y="475" font-size="10" fill="#8b8b9e" font-weight="400">20,000</text><text x="14" y="499" font-size="9.5" fill="#8b8b9e" opacity="0.85">Two edits at opposite ends of the list are described by one range that spans everything between them, so they cost what comparing would have cost. That limit is the single contiguous region, not the mutation log.</text></svg>