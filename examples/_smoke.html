<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste rapido</title>
<script src="../packages/voodoojs/dist/voodoo.full.min.js" data-manual defer></script>
</head>
<body>
<div v-component="teste">
  <div id="B" v-if="pronto"><i class="b" v-for="p in lista" :key="p.id">[{ p.nome }]</i></div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
  V.component('teste', {
    state: function () { return { lista: [], pronto: false }; },
    mounted: function () {
      var self = this;
      setTimeout(function () { self.pronto = true; self.lista = [{ id: 1, nome: 'um' }]; }, 150);
    }
  });
  // Hipotese: o MutationObserver do walker destroi o elemento modelo que o
  // v-for retira do DOM de proposito, matando o efeito da lista.
  V.config.autoDiscover = false;
  V.start();
  setTimeout(function () {
    var inst = Array.from(V.instances)[0];
    inst.lista.push({ id: 2, nome: 'dois' });
    setTimeout(function () {
      console.log('SEM OBSERVER  B=' + document.querySelectorAll('.b').length + ' (esperado 2)');
    }, 300);
  }, 600);
});
</script>
</body>
</html>
