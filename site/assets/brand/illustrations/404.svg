    <text x="450" y="126" font-size="34" fill="#FF3D8B" opacity="0.7" transform="rotate(12 450 126)">?</text>
    <text x="418" y="184" font-size="24" fill="#9B7BFF" opacity="0.6" transform="rotate(-8 418 184)">?</text>
