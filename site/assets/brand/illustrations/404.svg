<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" role="img" aria-labelledby="e404T e404D">
  <title id="e404T">Página não encontrada</title>
  <desc id="e404D">O mascote Vudu aparece perdido segurando um mapa com uma rota e um X, ao lado de uma placa de estrada com setas apontando para lados opostos, sobre um número 404 bem grande ao fundo.</desc>

  <defs>
