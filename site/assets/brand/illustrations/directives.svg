<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="dirT dirD">
  <title id="dirT">Diretivas v-* encantando uma tag HTML</title>
  <desc id="dirD">Uma varinha mágica toca um cartão de código com a tag button e dela saem três etiquetas de diretivas do Voodoo.js: v-click, v-text e v-model.</desc>

  <defs>
    <style>
      .vd-txt { fill: #2A2440; }
      .vd-txt-forte { fill: #14111F; }
      .vd-haste { stroke: #2A2440; }
      .vd-rim { stroke: transparent; }
      .vd-decor { opacity: 0.13; }
      @media (prefers-color-scheme: dark) {
        .vd-txt { fill: #FBF7F2; }
        .vd-txt-forte { fill: #FBF7F2; }
        .vd-haste { stroke: #9B7BFF; }
        .vd-rim { stroke: #FBF7F2; }
        .vd-decor { opacity: 0.26; }
      }
    </style>
    <radialGradient id="dirBurst" gradientUnits="userSpaceOnUse" cx="116" cy="292" r="70">
      <stop offset="0" stop-color="#FFB35C" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFB35C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- faíscas de fundo -->
  <g fill="#6D3BF5" opacity="0.14">
    <path d="M92 74 Q92 84 102 84 Q92 84 92 94 Q92 84 82 84 Q92 84 92 74 Z"/>
    <path d="M470 62 Q470 70 478 70 Q470 70 470 78 Q470 70 462 70 Q470 70 470 62 Z"/>
    <path d="M300 392 Q300 400 308 400 Q300 400 300 408 Q300 400 292 400 Q300 400 300 392 Z"/>
    <path d="M756 210 Q756 218 764 218 Q756 218 756 226 Q756 218 748 218 Q756 218 756 210 Z"/>
    <circle cx="196" cy="86" r="4"/>
    <circle cx="742" cy="406" r="5"/>
  </g>

  <!-- brilho do encantamento -->
  <circle cx="116" cy="292" r="70" fill="url(#dirBurst)"/>

  <!-- varinha encantando -->
  <g>
    <path class="vd-haste" d="M42 400 L102 314" stroke="#2A2440" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M39 397 L99 311" stroke="#9B7BFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <circle cx="38" cy="406" r="13" fill="#FF3D8B" stroke="#2A2440" stroke-width="3.5"/>
    <circle cx="34" cy="402" r="4" fill="#FBF7F2" opacity="0.8"/>
    <path d="M94 310 L108 320 L120 288 Z" fill="#FFB35C"/>
    <path d="M126 274 Q126 292 144 292 Q126 292 126 310 Q126 292 108 292 Q126 292 126 274 Z" fill="#FFB35C"/>
  </g>

  <!-- cartão de código -->
  <g>
    <rect x="93" y="153" width="380" height="152" rx="20" fill="#2A2440" opacity="0.1"/>
    <rect x="90" y="150" width="380" height="152" rx="20" fill="#FBF7F2" stroke="#2A2440" stroke-width="3"/>
    <circle cx="116" cy="176" r="6" fill="#FF4D4D" opacity="0.8"/>
    <circle cx="136" cy="176" r="6" fill="#FFB35C" opacity="0.8"/>
    <circle cx="156" cy="176" r="6" fill="#2ED9A5" opacity="0.8"/>
    <path d="M104 194 L458 194" stroke="#2A2440" stroke-width="1.5" opacity="0.15"/>
    <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="22" font-weight="700">
      <text x="116" y="230" fill="#6D3BF5">&lt;button</text>
      <text x="140" y="262" fill="#FF3D8B">v-click<tspan fill="#2A2440">="somar()"</tspan></text>
      <text x="116" y="290" fill="#6D3BF5">&gt;</text>
    </g>
  </g>

  <!-- ligações ate as diretivas -->
  <g fill="none" stroke="#6D3BF5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.6">
    <path d="M470 196 C500 170 508 130 534 114"/>
    <path d="M470 226 L552 224"/>
    <path d="M470 258 C500 288 508 320 534 334"/>
  </g>

  <!-- etiqueta v-click -->
  <g>
    <rect x="539" y="83" width="204" height="64" rx="18" fill="#2A2440" opacity="0.1"/>
    <rect x="536" y="80" width="204" height="64" rx="18" fill="#FBF7F2" stroke="#2A2440" stroke-width="3"/>
    <rect x="552" y="96" width="32" height="32" rx="10" fill="#FF3D8B"/>
    <path d="M562 103 l12 16 l-5 1 l3 7 l-4 2 l-3 -7 l-4 4 Z" fill="#FBF7F2"/>
    <text x="598" y="122" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
          font-size="21" font-weight="700" fill="#14111F">v-click</text>
  </g>

  <!-- etiqueta v-text -->
  <g>
    <rect x="559" y="193" width="204" height="64" rx="18" fill="#2A2440" opacity="0.1"/>
    <rect x="556" y="190" width="204" height="64" rx="18" fill="#FBF7F2" stroke="#2A2440" stroke-width="3"/>
    <rect x="572" y="206" width="32" height="32" rx="10" fill="#6D3BF5"/>
    <text x="588" y="230" text-anchor="middle" font-family="'Space Grotesk', Inter, system-ui, sans-serif"
          font-size="21" font-weight="700" fill="#FBF7F2">T</text>
    <text x="618" y="232" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
          font-size="21" font-weight="700" fill="#14111F">v-text</text>
  </g>

  <!-- etiqueta v-model -->
  <g>
    <rect x="539" y="303" width="216" height="64" rx="18" fill="#2A2440" opacity="0.1"/>
    <rect x="536" y="300" width="216" height="64" rx="18" fill="#FBF7F2" stroke="#2A2440" stroke-width="3"/>
    <rect x="552" y="316" width="32" height="32" rx="10" fill="#2ED9A5"/>
    <rect x="559" y="326" width="18" height="12" rx="3" fill="#14111F" opacity="0.75"/>
    <path d="M580 322 L580 342" stroke="#14111F" stroke-width="2.5" stroke-linecap="round"/>
    <text x="598" y="342" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace"
          font-size="21" font-weight="700" fill="#14111F">v-model</text>
  </g>

  <!-- faíscas do encantamento -->
  <g fill="#FF3D8B">
    <path d="M330 118 Q330 128 340 128 Q330 128 330 138 Q330 128 320 128 Q330 128 330 118 Z" opacity="0.85"/>
    <path d="M212 336 Q212 344 220 344 Q212 344 212 352 Q212 344 204 344 Q212 344 212 336 Z" opacity="0.7"/>
  </g>
  <g fill="#FFB35C">
    <path d="M418 116 Q418 124 426 124 Q418 124 418 132 Q418 124 410 124 Q418 124 418 116 Z" opacity="0.9"/>
    <path d="M168 330 Q168 337 175 337 Q168 337 168 344 Q168 337 161 337 Q168 337 168 330 Z" opacity="0.8"/>
  </g>
</svg>
