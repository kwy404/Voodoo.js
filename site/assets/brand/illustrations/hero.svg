    <rect x="380" y="300" width="170" height="120" rx="18" fill="#FBF7F2" stroke="#2A2440" stroke-width="3"/>
    <circle cx="412" cy="332" r="17" fill="#9B7BFF"/>
    <circle cx="412" cy="327" r="6" fill="#FBF7F2" opacity="0.9"/>
    <path d="M402 342 a10 10 0 0 1 20 0 Z" fill="#FBF7F2" opacity="0.9"/>
