<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="heroT heroD">
  <title id="heroT">Vudu conjurando interfaces</title>
  <desc id="heroD">O mascote Vudu aponta a varinha mágica e faz flutuar três elementos de interface, uma tag button, um formulário e um card, ligados a ele por linhas de energia roxa.</desc>

  <defs>
    <style>
      .vd-txt { fill: #2A2440; }
      .vd-txt-forte { fill: #14111F; }
      .vd-haste { stroke: #2A2440; }
      .vd-rim { stroke: transparent; }
      .vd-decor { opacity: 0.13; }
      @media (prefers-color-scheme: dark) {
        .vd-txt { fill: #FBF7F2; }
        .vd-txt-forte { fill: #FBF7F2; }
        .vd-haste { stroke: #9B7BFF; }
        .vd-rim { stroke: #FBF7F2; }
        .vd-decor { opacity: 0.26; }
      }
    </style>
    <linearGradient id="heroCloth" gradientUnits="userSpaceOnUse" x1="60" y1="130" x2="290" y2="410">
      <stop offset="0" stop-color="#FBF7F2"/>
      <stop offset="1" stop-color="#EDE4D8"/>
    </linearGradient>
    <linearGradient id="heroPatch" gradientUnits="userSpaceOnUse" x1="190" y1="318" x2="242" y2="372">
      <stop offset="0" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#6D3BF5"/>
    </linearGradient>
    <radialGradient id="heroGlow" gradientUnits="userSpaceOnUse" cx="257" cy="201" r="90">
      <stop offset="0" stop-color="#9B7BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroTip" gradientUnits="userSpaceOnUse" cx="399" cy="196" r="36">
      <stop offset="0" stop-color="#FFB35C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB35C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- runas de fundo -->
  <g class="vd-decor" fill="#6D3BF5" opacity="0.13">
    <path d="M96 60 Q96 70 106 70 Q96 70 96 80 Q96 70 86 70 Q96 70 96 60 Z"/>
    <path d="M700 92 Q700 100 708 100 Q700 100 700 108 Q700 100 692 100 Q700 100 700 92 Z"/>
    <path d="M356 62 Q356 69 363 69 Q356 69 356 76 Q356 69 349 69 Q356 69 356 62 Z"/>
    <path d="M744 430 Q744 439 753 439 Q744 439 744 448 Q744 439 735 439 Q744 439 744 430 Z"/>
    <path d="M632 468 Q632 475 639 475 Q632 475 632 482 Q632 475 625 475 Q632 475 632 468 Z"/>
    <circle cx="60" cy="440" r="5"/>
    <circle cx="770" cy="180" r="4"/>
    <circle cx="330" cy="470" r="4.5"/>
  </g>
  <g class="vd-decor" fill="none" stroke="#6D3BF5" stroke-width="2.5" opacity="0.12" stroke-linecap="round">
    <path d="M660 40 l18 0 M669 31 l0 18"/>
    <path d="M40 150 l0 20 M40 150 l14 8"/>
    <path d="M470 42 l16 10 l-16 10"/>
  </g>

  <!-- brilho da conjuração -->
  <circle cx="257" cy="201" r="90" fill="url(#heroGlow)"/>

  <!-- linhas de energia -->
  <g fill="none" stroke="#6D3BF5" stroke-width="3" stroke-linecap="round" stroke-dasharray="11 9" opacity="0.75">
