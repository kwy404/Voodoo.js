    <g fill="none" stroke-linecap="round">
      <path d="M320 318 C344 316 364 306 372 294" stroke="#2A2440" stroke-width="32"/>
      <path d="M320 318 C344 316 364 306 372 294" stroke="url(#heroCloth)" stroke-width="24"/>
