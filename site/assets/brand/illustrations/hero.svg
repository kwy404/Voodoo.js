    <rect x="588" y="298" width="86" height="6" rx="3" fill="#2A2440" opacity="0.35"/>
    <rect x="580" y="324" width="88" height="24" rx="9" fill="#6D3BF5"/>
    <rect x="594" y="333" width="60" height="6" rx="3" fill="#FBF7F2" opacity="0.9"/>
