<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Playground — Voodoo.js</title>
    <meta
      name="description"
      content="Write Voodoo.js in the browser and watch it run. Fifty examples, an editor and a live preview, with no build step anywhere in the loop."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://kwy404.github.io/Voodoo.js/playground.html" />

    <style>
      /* ===================================================================
         The playground, dressed as the editor people already know.

         The colours are VS Code's Dark+ verbatim, not an impression of it:
         #1e1e1e for the editor surface, #252526 for the side panels, #333333
         for the activity rail, #3c3c3c for the seams, and the Dark+ token hues
         underneath. Somebody who writes code every day recognises this in a
         glance, and recognition is the entire point — the page is asking them
         to read code, so it should look like the place they read code.

         The status bar is Voodoo violet rather than VS Code's blue because VS
         Code itself colours that strip per project, so a branded one reads as
         "this workspace" instead of "wrong shade".

         The one thing borrowed from CodePen rather than VS Code is the
         splitter: a pen is a thing you drag to give the half you care about
         more room, and that expectation arrives with anyone who has used one.
         =================================================================== */
      :root {
        --vs-editor: #1e1e1e;
        --vs-panel: #252526;
        --vs-rail: #333333;
        --vs-tab-idle: #2d2d2d;
        --vs-seam: #1b1b1b;
        --vs-line: #3c3c3c;
        --vs-ink: #cccccc;
        --vs-ink-soft: #9d9d9d;
        --vs-ink-faint: #7f8285;
        --vs-gutter: #858585;
        --vs-focus: #007acc;
        --vs-select: #264f78;
        --vs-hover: #2a2d2e;
        --vs-list-active: #37373d;
        --vs-status: #4b2ea8;
        --vs-status-hover: #5c3cc4;
        --brand: #a688ff;

        /* Dark+ token colours. */
        --c-tag: #569cd6;
        --c-attr: #9cdcfe;
        --c-str: #ce9178;
        --c-com: #6a9955;
        --c-key: #c586c0;
        --c-punct: #808080;

        --font: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, Helvetica, Arial,
          sans-serif;
        --mono: 'Cascadia Mono', Consolas, ui-monospace, SFMono-Regular, 'SF Mono', Menlo,
          'Liberation Mono', monospace;

        --rail: 48px;
        --side: 244px;
        --top: 38px;
        --status: 22px;
        --tabs: 35px;

        /* Where the splitter sits. Rewritten by the drag, restored from
           localStorage on load. */
        --split: 50%;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        grid-template-rows: var(--top) minmax(0, 1fr) var(--status);
        background: var(--vs-editor);
        color: var(--vs-ink);
        font: 13px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 1px solid var(--vs-focus);
        outline-offset: -1px;
      }

      /* ----------------------------------------------------------- title bar */
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 10px;
        background: var(--vs-rail);
        border-bottom: 1px solid var(--vs-seam);
        font-size: 12px;
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--vs-ink);
        text-decoration: none;
        font-weight: 600;
        white-space: nowrap;
      }

      .brand svg {
        width: 17px;
        height: 17px;
        color: var(--brand);
      }

      .brand .tag {
        padding: 1px 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.09);
        color: var(--vs-ink-soft);
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }

      .topbar nav {
        display: flex;
        gap: 1px;
      }

      .topbar nav a {
        padding: 4px 9px;
        border-radius: 4px;
        color: var(--vs-ink-soft);
        text-decoration: none;
      }

      .topbar nav a:hover {
        background: rgba(255, 255, 255, 0.09);
        color: #fff;
      }

      /* The command bar. VS Code puts one dead centre, and here it earns the
         space: typing in it filters the example list beside it. */
      .quick {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        width: min(420px, 34vw);
        height: 24px;
        padding: 0 8px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        background: #2b2b2b;
      }

      .quick:focus-within {
        border-color: var(--vs-focus);
      }

      .quick svg {
        width: 13px;
        height: 13px;
        flex: none;
        color: var(--vs-ink-faint);
      }

      .quick input {
        flex: 1;
        min-width: 0;
        border: 0;
        background: transparent;
        color: var(--vs-ink);
        font: inherit;
        font-size: 12px;
        outline: none;
      }

      .quick input::placeholder {
        color: var(--vs-ink-faint);
      }

      .quick kbd {
        flex: none;
        padding: 0 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.09);
        color: var(--vs-ink-faint);
        font: 500 10px/16px var(--font);
      }

      .topbar .end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--vs-ink);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }

      .tbtn:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .tbtn.primary {
        background: var(--vs-focus);
        border-color: var(--vs-focus);
        color: #fff;
        font-weight: 600;
      }

      .tbtn.primary:hover {
        background: #1b8ad6;
      }

      .tbtn svg {
        width: 12px;
        height: 12px;
      }

      /* ----------------------------------------------------------- workbench */
      .shell {
        display: grid;
        grid-template-columns: var(--rail) var(--side) minmax(0, 1fr);
        min-height: 0;
      }

      /* The activity rail. It is the single fastest way to say "editor", so
         every item on it does something rather than posing for the screenshot. */
      .activitybar {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--vs-rail);
        border-right: 1px solid var(--vs-seam);
      }

      .activitybar a,
      .activitybar button {
        width: var(--rail);
        height: 46px;
        display: grid;
        place-items: center;
        border: 0;
        border-left: 2px solid transparent;
        background: none;
        color: #858585;
        cursor: pointer;
      }

      .activitybar svg {
        width: 22px;
        height: 22px;
      }

      .activitybar a:hover,
      .activitybar button:hover {
        color: #fff;
      }

      .activitybar button[aria-pressed='true'] {
        color: #fff;
        border-left-color: #fff;
      }

      .activitybar .spacer {
        flex: 1;
      }

      /* ------------------------------------------------------------ explorer */
      .side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--vs-panel);
        border-right: 1px solid var(--vs-seam);
      }

      .side h2 {
        margin: 0;
        padding: 10px 20px 8px;
        font: 400 11px/1.4 var(--font);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--vs-ink-soft);
        user-select: none;
      }

      #file-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: 12px;
      }

      #file-list::-webkit-scrollbar,
      .stack pre::-webkit-scrollbar,
      .stack textarea::-webkit-scrollbar,
      .frame-wrap::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      #file-list::-webkit-scrollbar-thumb,
      .stack pre::-webkit-scrollbar-thumb,
      .stack textarea::-webkit-scrollbar-thumb,
      .frame-wrap::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
      }

      #file-list::-webkit-scrollbar-thumb:hover,
      .stack textarea::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.28);
      }

      #file-list::-webkit-scrollbar-track,
      .stack pre::-webkit-scrollbar-track,
      .stack textarea::-webkit-scrollbar-track {
        background: transparent;
      }

      /* A folder row: chevron, label, count. It collapses, because a tree whose
         arrows do nothing is worse than no arrows. */
      #file-list .group {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        padding: 4px 10px 4px 6px;
        border: 0;
        background: none;
        color: var(--vs-ink);
        font: 700 11px/1.6 var(--font);
        text-align: left;
        cursor: pointer;
        user-select: none;
      }

      #file-list .group:hover {
        background: var(--vs-hover);
      }

      #file-list .group .chev {
        flex: none;
        width: 16px;
        height: 16px;
        display: grid;
        place-items: center;
        color: var(--vs-ink-soft);
      }

      #file-list .group .chev::before {
        content: '';
        width: 5px;
        height: 5px;
        border-right: 1.4px solid currentColor;
        border-bottom: 1.4px solid currentColor;
        transform: translateY(-1px) rotate(45deg);
        transition: transform 0.12s ease;
      }

      #file-list .group[aria-expanded='false'] .chev::before {
        transform: translateX(-1px) rotate(-45deg);
      }

      #file-list .group .count {
        margin-left: auto;
        font-weight: 400;
        color: var(--vs-ink-faint);
      }

      #file-list .group[aria-expanded='false'] + .group-items {
        display: none;
      }

      #file-list button[data-id] {
        position: relative;
        display: block;
        width: 100%;
        padding: 3px 10px 3px 40px;
        border: 0;
        background: none;
        color: var(--vs-ink);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* The file glyph, so the list reads as an explorer and not a menu. */
      #file-list button[data-id]::before {
        content: '';
        position: absolute;
        left: 22px;
        top: 50%;
        width: 9px;
        height: 11px;
        margin-top: -6px;
        border: 1px solid #6e7681;
        border-top-right-radius: 3px;
        background: linear-gradient(rgba(227, 121, 51, 0.35), rgba(227, 121, 51, 0.08));
      }

      #file-list button[data-id]:hover {
        background: var(--vs-hover);
      }

      #file-list button[aria-current='true'] {
        background: var(--vs-list-active);
        color: #fff;
      }

      #file-list button[aria-current='true']::before {
        border-color: #e37933;
      }

      #file-list .empty {
        padding: 10px 20px;
        color: var(--vs-ink-faint);
        font-size: 12px;
      }

      /* -------------------------------------------------------- editor group */
      .workbench {
        display: grid;
        grid-template-columns: minmax(220px, var(--split)) 6px minmax(220px, 1fr);
        min-width: 0;
        min-height: 0;
      }

      .editor {
        display: grid;
        grid-template-rows: var(--tabs) auto minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        background: var(--vs-editor);
      }

      .tabstrip {
        display: flex;
        align-items: stretch;
        min-width: 0;
        background: var(--vs-tab-idle);
        border-bottom: 1px solid var(--vs-seam);
        user-select: none;
      }

      .filetab {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: var(--vs-editor);
        border-right: 1px solid var(--vs-seam);
        border-top: 1px solid var(--brand);
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
      }

      .filetab .ext {
        font: 600 11px/1 var(--mono);
        color: #e37933;
      }

      .filetab .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand);
        flex: none;
        visibility: hidden;
      }

      .filetab.dirty .dot {
        visibility: visible;
      }

      /* Breadcrumbs, the row VS Code puts under the tabs. It is the only place
         the group name appears next to the file, so the picker on the left and
         the buffer in the middle stay tied together. */
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        height: 24px;
        padding: 0 14px;
        background: var(--vs-editor);
        color: var(--vs-ink-faint);
        font-size: 11.5px;
        white-space: nowrap;
        user-select: none;
      }

      .breadcrumbs .sep {
        width: 5px;
        height: 5px;
        flex: none;
        border-right: 1.2px solid currentColor;
        border-bottom: 1.2px solid currentColor;
        transform: rotate(-45deg);
        opacity: 0.7;
      }

      .desc {
        margin-left: auto;
        padding-left: 16px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        font-style: italic;
        color: var(--vs-ink-faint);
      }

      .code-area {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
        background: var(--vs-editor);
      }

      .gutter {
        padding: 8px 0;
        background: var(--vs-editor);
        color: var(--vs-gutter);
        font: 13px/1.5 var(--mono);
        text-align: right;
        overflow: hidden;
        user-select: none;
      }

      .gutter span {
        display: block;
        padding-right: 18px;
      }

      /* The editor is a transparent textarea sitting exactly on top of a
         coloured <pre>. Both use identical metrics, so the caret and the
         selection land on the glyphs the reader sees. This is how you get
         highlighting without pulling in an editor library, and without eval,
         which the CSP forbids. */
      .stack {
        position: relative;
        min-width: 0;
        overflow: hidden;
      }

      .stack pre,
      .stack textarea {
        position: absolute;
        inset: 0;
        margin: 0;
        padding: 8px 14px 8px 0;
        border: 0;
        font: 13px/1.5 var(--mono);
        tab-size: 2;
        white-space: pre;
        word-wrap: normal;
        overflow: auto;

        /* The caret is only in the right place while these two lay text out
           identically, character for character, and ligatures quietly broke
           that. Cascadia forms `=>` into a single glyph in the textarea, where
           the text is plain, and cannot form it in the highlighted layer, where
           the same two characters usually land in different spans. One glyph
           against two, on every arrow in the file, and everything after it on
           that line sat a few pixels off from where you were typing.

           Spelt out rather than left to the shorthand so that neither layer can
           inherit something the other does not. */
        font-variant-ligatures: none;
        font-kerning: none;
        letter-spacing: normal;
        word-spacing: normal;
        text-transform: none;
        font-feature-settings: normal;
      }

      .stack pre {
        pointer-events: none;
        color: var(--vs-ink);
      }

      /* The whole reason the caret drifted from the text.
         The highlighted layer is `<pre><code>`, and every browser's own
         stylesheet carries `code { font-family: monospace }`. That beats
         inheritance, so the `<code>` and every coloured span inside it were
         drawn in the generic monospace — Courier New on Windows — while the
         textarea above them used Cascadia. Roughly six percent narrower per
         character, which is invisible on a short line and, by the middle of a
         long Tailwind class attribute, put the caret a dozen pixels from the
         character it was pointing at. Typing landed somewhere other than where
         you were looking.

         `font: inherit` on both, so the layer cannot pick its own font again. */
      .stack pre code,
      .stack pre span {
        font: inherit;
        font-variant-ligatures: inherit;
        letter-spacing: inherit;
      }

      .stack textarea {
        width: 100%;
        height: 100%;
        resize: none;
        outline: 0;
        background: transparent;
        color: transparent;
        caret-color: #aeafad;
      }

      /* Translucent on purpose.
         The textarea's own text is transparent, so a solid selection colour
         painted over the highlighted layer beneath it and the selected code
         simply vanished: you dragged across a line and watched it turn into a
         blue bar. Alpha lets the coloured text underneath stay readable while
         still reading as a selection. */
      .stack textarea::selection {
        background: rgba(38, 79, 120, 0.55);
      }

      .tk-tag {
        color: var(--c-tag);
      }
      .tk-attr {
        color: var(--c-attr);
      }
      .tk-str {
        color: var(--c-str);
      }
      /* Upright, not italic. Italic glyphs are a different width from the
         upright ones the textarea draws, so a single comment pushed the caret
         out of step with the painted text for the rest of that line. Dark+
         renders comments upright anyway, so this is the accurate colour too. */
      .tk-com {
        color: var(--c-com);
      }
      .tk-interp {
        color: var(--c-key);
      }
      .tk-punct {
        color: var(--c-punct);
      }

      /* ------------------------------------------------------------ splitter */
      .splitter {
        position: relative;
        background: var(--vs-seam);
        cursor: col-resize;
        touch-action: none;
      }

      .splitter::after {
        content: '';
        position: absolute;
        inset: 0;
        background: transparent;
        transition: background 0.12s ease;
      }

      .splitter:hover::after,
      body.dragging .splitter::after {
        background: var(--vs-focus);
      }

      /* An iframe eats pointer events, so a drag that crosses into the preview
         would stop dead halfway. Pointer capture keeps the events coming, and
         this makes sure nothing inside reacts to a cursor merely passing over. */
      body.dragging {
        cursor: col-resize;
        user-select: none;
      }

      body.dragging iframe {
        pointer-events: none;
      }

      /* ------------------------------------------------------------- preview */
      .preview {
        display: grid;
        grid-template-rows: var(--tabs) minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        background: var(--vs-panel);
      }

      .preview-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        background: var(--vs-tab-idle);
        border-bottom: 1px solid var(--vs-seam);
        font-size: 12px;
        color: var(--vs-ink-soft);
        user-select: none;
      }

      .live {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3fb950;
        box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.2);
        flex: none;
      }

      .widths {
        margin-left: auto;
        display: flex;
        gap: 2px;
        padding: 2px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.06);
      }

      .widths button {
        padding: 2px 9px;
        border: 0;
        border-radius: 3px;
        background: none;
        color: var(--vs-ink-soft);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .widths button:hover {
        color: #fff;
      }

      .widths button[aria-pressed='true'] {
        background: var(--vs-focus);
        color: #fff;
      }

      /* The checkerboard reads as "nothing here yet" at the edges when the
         preview is narrowed to a phone width, the way a design tool does. */
      .frame-wrap {
        display: flex;
        justify-content: center;
        min-height: 0;
        overflow: auto;
        background: #161616;
        background-image: linear-gradient(45deg, #1b1b1b 25%, transparent 25%),
          linear-gradient(-45deg, #1b1b1b 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #1b1b1b 75%),
          linear-gradient(-45deg, transparent 75%, #1b1b1b 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      }

      #frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      /* ----------------------------------------------------------- statusbar */
      .statusbar {
        display: flex;
        align-items: stretch;
        background: var(--vs-status);
        color: #fff;
        font-size: 12px;
        user-select: none;
      }

      .statusbar span {
        display: flex;
        align-items: center;
        padding: 0 8px;
      }

      .statusbar .remote {
        background: rgba(0, 0, 0, 0.22);
        font-weight: 600;
      }

      .statusbar .right {
        margin-left: auto;
        display: flex;
        align-items: stretch;
      }

      .statusbar .right span {
        color: rgba(255, 255, 255, 0.88);
      }

      /* The explorer folds away from the rail, the way it does in the editor. */
      body.no-explorer .shell {
        grid-template-columns: var(--rail) minmax(0, 1fr);
      }

      body.no-explorer .side {
        display: none;
      }

      /* ---------------------------------------------------------- responsive */
      .mobile-switch {
        display: none;
      }

      @media (max-width: 1080px) {
        .quick {
          display: none;
        }
      }

      @media (max-width: 1000px) {
        .workbench {
          grid-template-columns: minmax(0, 1fr);
        }
        .splitter,
        .preview {
          display: none;
        }
        body.show-preview .editor {
          display: none;
        }
        body.show-preview .preview {
          display: grid;
        }
        .mobile-switch {
          display: inline-flex;
        }
      }

      @media (max-width: 760px) {
        .shell {
          grid-template-columns: var(--rail) minmax(0, 1fr);
        }
        .side {
          display: none;
        }
        body.show-files .side {
          display: flex;
          grid-column: 2;
        }
        body.show-files .workbench {
          display: none;
        }
        .topbar nav,
        .brand .tag {
          display: none;
        }

        /* Reset and Share come off the title bar rather than off the page:
           the activity rail carries both, and at this width the bar had six
           controls fighting for 375px and losing. */
        #btn-reset,
        #btn-share {
          display: none;
        }

        .statusbar .right span:not(:last-child) {
          display: none;
        }
      }

      @media (max-width: 420px) {
        .brand .name,
        .statusbar #status-lines {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="topbar">
      <a class="brand" href="./">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 5h6.4l5.6 15.2L21.6 5H28L18.8 28h-5.6L4 5z" fill="currentColor" />
        </svg>
        <span class="name">Voodoo.js</span>
        <span class="tag">Playground</span>
      </a>

      <nav aria-label="Main">
        <a href="./">Home</a>
        <a href="docs/">Docs</a>
        <a href="examples/">Examples</a>
      </nav>

      <div class="quick">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" stroke-linecap="round" />
        </svg>
        <input id="quickopen" type="search" placeholder="Go to example" aria-label="Filter examples" />
        <kbd>Ctrl P</kbd>
      </div>

      <div class="end">
        <button class="tbtn mobile-switch" id="btn-files">Files</button>
        <button class="tbtn mobile-switch" id="btn-view">Preview</button>
        <button class="tbtn" id="btn-reset" title="Restore the original example">Reset</button>
        <button class="tbtn" id="btn-share" title="Copy a link that reopens this code">Share</button>
        <button class="tbtn primary" id="btn-run" title="Ctrl+Enter">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 4.5l13 7.5-13 7.5z" />
          </svg>
          Run
        </button>
      </div>
    </div>

    <div class="shell">
      <nav class="activitybar" aria-label="Activity">
        <button
          type="button"
          data-act="explorer"
          aria-pressed="true"
          title="Explorer"
          aria-label="Explorer"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M13.5 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8.5z" />
            <path d="M13.5 3v5.5H19" />
          </svg>
        </button>

        <button type="button" data-act="run" title="Run (Ctrl+Enter)" aria-label="Run">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M7 4.5l13 7.5-13 7.5z" stroke-linejoin="round" />
          </svg>
        </button>

        <button type="button" data-act="share" title="Copy a shareable link" aria-label="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2" stroke-linecap="round" />
            <path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2" stroke-linecap="round" />
          </svg>
        </button>

        <button type="button" data-act="reset" title="Restore the original example" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 12a8 8 0 1 0 2.6-5.9" stroke-linecap="round" />
            <path d="M4 4.5V10h5.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <span class="spacer"></span>

        <a href="docs/" title="Documentation" aria-label="Documentation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v18H6.5A1.5 1.5 0 0 1 5 19.5z" />
            <path d="M8 7.5h7M8 11h7" stroke-linecap="round" />
          </svg>
        </a>

        <a href="./" title="Back to the site" aria-label="Back to the site">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 11l8-7 8 7v8.5A1.5 1.5 0 0 1 18.5 21H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19.5z" stroke-linejoin="round" />
          </svg>
        </a>
      </nav>

      <aside class="side">
        <h2>Explorer</h2>
        <div id="file-list"></div>
      </aside>

      <div class="workbench">
        <div class="editor">
          <div class="tabstrip">
            <div class="filetab" id="filetab">
              <span class="ext" aria-hidden="true">&lt;&gt;</span>
              <span id="filename">index.html</span>
              <span class="dot" aria-hidden="true"></span>
            </div>
          </div>

          <div class="breadcrumbs">
            <span>examples</span>
            <span class="sep" aria-hidden="true"></span>
            <span id="breadcrumb">basics</span>
            <span class="sep" aria-hidden="true"></span>
            <span>index.html</span>
            <span class="desc" id="example-desc"></span>
          </div>

          <div class="code-area">
            <div class="gutter" id="gutter" aria-hidden="true"></div>
            <div class="stack">
              <pre id="highlight" aria-hidden="true"><code></code></pre>
              <textarea
                id="code"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                aria-label="HTML editor"
              ></textarea>
            </div>
          </div>
        </div>

        <div
          class="splitter"
          id="splitter"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize the editor and the preview"
          aria-valuemin="18"
          aria-valuemax="82"
          aria-valuenow="50"
          tabindex="0"
          title="Drag to resize, double-click to even it out"
        ></div>

        <div class="preview">
          <div class="preview-head">
            <span class="live" aria-hidden="true"></span>
            <span id="preview-label">Live preview</span>
            <div class="widths" role="group" aria-label="Preview width">
              <button data-w="100%" aria-pressed="true">Full</button>
              <button data-w="768px" aria-pressed="false">Tablet</button>
              <button data-w="380px" aria-pressed="false">Phone</button>
            </div>
          </div>
          <div class="frame-wrap">
            <!--
              allow-forms is here because a sandboxed frame without it blocks
              submission outright, before any handler runs. An example written
              as `<form @submit.prevent="...">` therefore did nothing at all and
              logged "Blocked form submission because the form's frame is
              sandboxed" — the prevent never got the chance to prevent anything.

              No allow-same-origin, deliberately: the frame keeps an opaque
              origin, so page code cannot reach this document, its storage or
              its cookies. Letting a form submit inside a frame that has no
              origin of its own costs nothing.
            -->
            <iframe id="frame" title="Live preview"
              sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
          </div>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <span class="remote">Voodoo.js</span>
      <span id="status-example">state</span>
      <span id="status-lines">1 line</span>
      <div class="right">
        <span>Ctrl+Enter to run</span>
        <span>HTML</span>
        <span>UTF-8</span>
        <span>voodoojs@0.13.0</span>
      </div>
    </div>

    <!--
      Three files rather than one. They are written and revised independently
      and each is already long; keeping them apart means an edit to the JSX set
      cannot touch the others, and the diffs stay readable. The app concatenates
      whichever of the three are present, so any one of them can be dropped
      without the page noticing.
    -->
    <script src="assets/playground-examples.js?v=3fc077e6"></script>
    <script src="assets/playground-examples-jsx.js?v=d8242c3c"></script>
    <script src="assets/playground-examples-showcase.js?v=340b197c"></script>
    <script src="assets/playground-app.js?v=f36eb2e7"></script>
  </body>
</html>
